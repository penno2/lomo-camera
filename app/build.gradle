plugins {
    id 'com.android.application'
}

android {
    namespace 'com.harristownapps.lomocamera'
    compileSdk 36

    defaultConfig {
        applicationId 'com.harristownapps.lomocamera'
        minSdk 33
        targetSdk 36
        versionCode 1
        versionName '0.1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
