plugins {
    id 'com.android.application'
}

android {
    namespace 'com.harristownapps.lomocamera'
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'com.harristownapps.lomocamera'
        minSdk 33
        targetSdk 36
        versionCode 6
        versionName '1.3'
    }

    buildTypes {
        debug {
            // Side-by-side beta; never replace the official F-Droid installation.
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
        }
        release {
            // Temporary locally installed performance-test build.
            //applicationIdSuffix '.releasetest'
            //signingConfig signingConfigs.debug

            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
}
