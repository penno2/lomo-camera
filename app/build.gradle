plugins {
    id 'com.android.application'
}

android {
    namespace 'com.harristownapps.lomocamera'
    compileSdk 36

    defaultConfig {
        applicationId 'com.harristownapps.lomocamera'
        minSdk 33
        targetSdk 36
        versionCode 3
        versionName '1.1'
    }

    buildTypes {
        debug {
            // Side-by-side beta; never replace the official F-Droid installation.
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta'
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
