name: Apply camera UI polish

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Add one-shot camera UI polish migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply camera-style controls and saved indicator
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/example/lomocamera/MainActivity.java')
          s = path.read_text()

          def replace_once(old, new, label):
              global s
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              s = s.replace(old, new, 1)

          replace_once(
              'import android.widget.FrameLayout;\nimport android.widget.LinearLayout;\nimport android.widget.TextView;\nimport android.widget.Toast;',
              'import android.widget.FrameLayout;\nimport android.widget.ImageButton;\nimport android.widget.ImageView;\nimport android.widget.LinearLayout;\nimport android.widget.TextView;\nimport android.widget.Toast;',
              'widget imports')

          replace_once(
              '    private ShutterButton shutterButton;\n    private TextView flashButton;\n    private TextView switchButton;',
              '    private ShutterButton shutterButton;\n    private ImageButton flashButton;\n    private ImageButton switchButton;\n    private FrameLayout rootView;\n    private TextView savedIndicator;',
              'control fields')

          replace_once(
              '        FrameLayout root = new FrameLayout(this);\n        root.setBackgroundColor(Color.BLACK);',
              '        rootView = new FrameLayout(this);\n        FrameLayout root = rootView;\n        root.setBackgroundColor(Color.BLACK);',
              'root view')

          replace_once(
              '        flashButton = makeControlButton("OFF", "Flash off");\n        flashButton.setOnClickListener(v -> cycleFlashMode());\n        topControls.addView(flashButton, squareLayout(58));\n\n        switchButton = makeControlButton("↻", "Switch camera");\n        switchButton.setTextSize(25f);\n        switchButton.setOnClickListener(v -> switchCamera());',
              '        flashButton = makeIconControlButton(R.drawable.ic_flash_off, "Flash off");\n        flashButton.setOnClickListener(v -> cycleFlashMode());\n        topControls.addView(flashButton, squareLayout(58));\n\n        switchButton = makeIconControlButton(R.drawable.ic_camera_switch, "Switch camera");\n        switchButton.setOnClickListener(v -> switchCamera());',
              'top controls')

          replace_once(
              '''    private TextView makeControlButton(String text, String contentDescription) {
        TextView v = new TextView(this);
        v.setText(text);
        v.setTextColor(Color.WHITE);
        v.setTextSize(12f);
        v.setGravity(Gravity.CENTER);
        v.setContentDescription(contentDescription);
        v.setClickable(true);
        v.setFocusable(true);
        v.setAllCaps(false);
        GradientDrawable bg = new GradientDrawable();
        bg.setShape(GradientDrawable.OVAL);
        bg.setColor(0x99000000);
        bg.setStroke(dp(1), 0x66FFFFFF);
        v.setBackground(bg);
        return v;
    }
''',
              '''    private ImageButton makeIconControlButton(int iconRes, String contentDescription) {
        ImageButton v = new ImageButton(this);
        v.setImageResource(iconRes);
        v.setColorFilter(Color.WHITE);
        v.setScaleType(ImageView.ScaleType.CENTER_INSIDE);
        v.setPadding(dp(14), dp(14), dp(14), dp(14));
        v.setContentDescription(contentDescription);
        v.setClickable(true);
        v.setFocusable(true);
        GradientDrawable bg = new GradientDrawable();
        bg.setShape(GradientDrawable.OVAL);
        bg.setColor(0x99000000);
        bg.setStroke(dp(1), 0x66FFFFFF);
        v.setBackground(bg);
        return v;
    }
''',
              'control helper')

          replace_once(
              '''        switch (flashMode) {
            case OFF:
                flashButton.setText("OFF");
                flashButton.setContentDescription("Flash off");
                break;
            case AUTO:
                flashButton.setText("AUTO");
                flashButton.setContentDescription("Flash automatic");
                break;
            case ON:
                flashButton.setText("ON");
                flashButton.setContentDescription("Flash on");
                break;
        }
''',
              '''        switch (flashMode) {
            case OFF:
                flashButton.setImageResource(R.drawable.ic_flash_off);
                flashButton.setContentDescription("Flash off");
                break;
            case AUTO:
                flashButton.setImageResource(R.drawable.ic_flash_auto);
                flashButton.setContentDescription("Flash automatic");
                break;
            case ON:
                flashButton.setImageResource(R.drawable.ic_flash_on);
                flashButton.setContentDescription("Flash on");
                break;
        }
''',
              'flash icon states')

          replace_once(
              '''    private void finishPhotoProcessing(String message) {
        cancelPrecaptureTimeout();
        captureState = CAPTURE_STATE_PREVIEW;
        processingPhoto = false;
        if (shutterButton != null) shutterButton.setEnabled(true);
        showToast(message);
    }
''',
              '''    private void finishPhotoProcessing(String message) {
        cancelPrecaptureTimeout();
        captureState = CAPTURE_STATE_PREVIEW;
        processingPhoto = false;
        if (shutterButton != null) shutterButton.setEnabled(true);
        if ("Saved to DCIM/Lomo".equals(message)) {
            showSavedIndicator();
        } else {
            showToast(message);
        }
    }
''',
              'save feedback')

          replace_once(
              '''    private void showToast(String text) {
        runOnUiThread(() -> Toast.makeText(this, text, Toast.LENGTH_SHORT).show());
    }
''',
              '''    private void showSavedIndicator() {
        runOnUiThread(() -> {
            if (rootView == null) return;
            if (savedIndicator != null && savedIndicator.getParent() == rootView) {
                rootView.removeView(savedIndicator);
            }

            TextView label = new TextView(this);
            label.setText("Saved");
            label.setTextColor(Color.WHITE);
            label.setTextSize(14f);
            label.setGravity(Gravity.CENTER);
            label.setPadding(dp(18), dp(9), dp(18), dp(9));

            GradientDrawable bg = new GradientDrawable();
            bg.setColor(0xCC111111);
            bg.setCornerRadius(dp(18));
            bg.setStroke(dp(1), 0x44FFFFFF);
            label.setBackground(bg);

            FrameLayout.LayoutParams lp = new FrameLayout.LayoutParams(
                    FrameLayout.LayoutParams.WRAP_CONTENT,
                    FrameLayout.LayoutParams.WRAP_CONTENT,
                    Gravity.TOP | Gravity.CENTER_HORIZONTAL);
            lp.topMargin = dp(36);
            rootView.addView(label, lp);
            savedIndicator = label;

            label.setAlpha(0f);
            label.animate().alpha(1f).setDuration(80L).withEndAction(() ->
                    label.animate().alpha(0f).setStartDelay(650L).setDuration(140L)
                            .withEndAction(() -> {
                                if (label.getParent() == rootView) rootView.removeView(label);
                                if (savedIndicator == label) savedIndicator = null;
                            }).start()).start();
        });
    }

    private void showToast(String text) {
        runOnUiThread(() -> Toast.makeText(this, text, Toast.LENGTH_SHORT).show());
    }
''',
              'saved indicator method')

          path.write_text(s)

          drawable = Path('app/src/main/res/drawable')
          drawable.mkdir(parents=True, exist_ok=True)

          (drawable / 'ic_flash_on.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="32dp" android:height="32dp"
    android:viewportWidth="32" android:viewportHeight="32">
    <path android:fillColor="#FFFFFFFF"
        android:pathData="M18,2 L7,18 L15,18 L12,30 L25,12 L17,12 Z" />
</vector>
''')

          (drawable / 'ic_flash_off.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="32dp" android:height="32dp"
    android:viewportWidth="32" android:viewportHeight="32">
    <path android:fillColor="#FFFFFFFF"
        android:pathData="M18,2 L7,18 L15,18 L12,30 L25,12 L17,12 Z" />
    <path android:fillColor="@android:color/transparent"
        android:strokeColor="#FFFFFFFF" android:strokeWidth="2.6"
        android:strokeLineCap="round"
        android:pathData="M5,5 L27,27" />
</vector>
''')

          (drawable / 'ic_flash_auto.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="32dp" android:height="32dp"
    android:viewportWidth="32" android:viewportHeight="32">
    <path android:fillColor="#FFFFFFFF"
        android:pathData="M15,2 L5,17 L12,17 L10,29 L21,13 L14,13 Z" />
    <path android:fillColor="@android:color/transparent"
        android:strokeColor="#FFFFFFFF" android:strokeWidth="2.1"
        android:strokeLineCap="round" android:strokeLineJoin="round"
        android:pathData="M20,22 L24,13 L28,22 M21.5,18.5 L26.5,18.5" />
</vector>
''')

          (drawable / 'ic_camera_switch.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
<vector xmlns:android="http://schemas.android.com/apk/res/android"
    android:width="32dp" android:height="32dp"
    android:viewportWidth="32" android:viewportHeight="32">
    <path android:fillColor="@android:color/transparent"
        android:strokeColor="#FFFFFFFF" android:strokeWidth="2.5"
        android:strokeLineCap="round" android:strokeLineJoin="round"
        android:pathData="M6,13 C8,7 15,4 21,6 C24,7 26,9 27,12 M22,7 L27,12 L28,6 M26,19 C24,25 17,28 11,26 C8,25 6,23 5,20 M10,25 L5,20 L4,26" />
</vector>
''')
          PY

      - name: Commit UI polish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/lomocamera/MainActivity.java app/src/main/res/drawable
          git commit -m "Use camera-style flash and switch controls"
          git push
