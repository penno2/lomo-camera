name: Apply camera UI polish

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Run UI polish migration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Apply camera-style controls and saved indicator
        run: python tools/apply_ui_polish.py

      - name: Commit UI polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/lomocamera/MainActivity.java app/src/main/res/drawable
          git commit -m "Use camera-style flash and switch controls"
          git push
